<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 太阳 -->
  <circle cx="280" cy="180" r="80" fill="#ffd700" opacity="0.9"/>
  <g stroke="#ffd700" stroke-width="12" stroke-linecap="round" opacity="0.7">
    <line x1="280" y1="60" x2="280" y2="80"/>
    <line x1="280" y1="280" x2="280" y2="300"/>
    <line x1="160" y1="180" x2="180" y2="180"/>
    <line x1="380" y1="180" x2="400" y2="180"/>
    <line x1="195" y1="95" x2="209" y2="109"/>
    <line x1="351" y1="251" x2="365" y2="265"/>
    <line x1="195" y1="265" x2="209" y2="251"/>
    <line x1="351" y1="95" x2="365" y2="109"/>
  </g>
  <!-- 云 -->
  <g fill="white" opacity="0.95">
    <circle cx="160" cy="280" r="55"/>
    <circle cx="210" cy="260" r="70"/>
    <circle cx="270" cy="270" r="60"/>
    <circle cx="310" cy="285" r="45"/>
    <rect x="110" y="265" width="240" height="80" rx="40"/>
  </g>
  <!-- 温度 -->
  <text x="230" y="420" font-family="sans-serif" font-size="100" font-weight="bold" fill="white" text-anchor="middle">28°</text>
</svg>
