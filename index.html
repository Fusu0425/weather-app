<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>厦门天气</title>
    <meta name="description" content="厦门实时天气与7天预报，接雨滴小游戏">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="厦门天气">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-row">
                <button class="icon-btn" id="locateBtn" title="定位">📍</button>
                <h1 id="cityName">厦门天气</h1>
                <button class="icon-btn" id="refreshBtn" title="刷新">🔄</button>
                <button class="icon-btn" id="themeBtn" title="暗色模式">🌓</button>
            </div>
            <span class="header-date" id="updateTime"></span>
        </header>

        <!-- 天气预警条 -->
        <div class="alert-bar" id="alertBar"></div>

        <!-- 天气内容区 -->
        <div id="weatherContent">
            <!-- 骨架屏 -->
            <div class="skeleton skeleton-current">
                <div class="skeleton-icon"></div>
                <div class="skeleton-temp"></div>
                <div class="skeleton-text"></div>
            </div>
            <h2>未来 7 天</h2>
            <div class="skeleton-forecast" style="margin-bottom:20px;">
                <div class="skeleton-fc-item"></div>
                <div class="skeleton-fc-item"></div>
                <div class="skeleton-fc-item"></div>
                <div class="skeleton-fc-item"></div>
                <div class="skeleton-fc-item"></div>
            </div>
            <h2>未来 24 小时</h2>
            <div class="skeleton-hourly" style="margin-bottom:16px;">
                <div class="skeleton-hr"></div>
                <div class="skeleton-hr"></div>
                <div class="skeleton-hr"></div>
                <div class="skeleton-hr"></div>
                <div class="skeleton-hr"></div>
                <div class="skeleton-hr"></div>
            </div>
            <div class="skeleton-detail-grid">
                <div class="skeleton-dc"></div>
                <div class="skeleton-dc"></div>
                <div class="skeleton-dc"></div>
                <div class="skeleton-dc"></div>
            </div>
        </div>

        <!-- 游戏区 -->
        <div class="game-section">
            <h2>接雨滴</h2>
            <p class="game-hint">
                🖱️ 鼠标/触摸移动 · ⌨️ 方向键 ← → · 接 💧 躲 ⚡
            </p>
            <div class="game-wrapper">
                <canvas id="gameCanvas"></canvas>
                <div class="game-controls">
                    <div class="game-scores">
                        <span>得分 <strong id="score">0</strong></span>
                        <span class="high-score">🏆 <strong id="highScore">0</strong></span>
                    </div>
                    <button class="game-btn" id="restartBtn">重来</button>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="app-footer">
            厦门天气 · 数据来源 Open-Meteo · <span id="refreshHint"></span>
        </div>
    </div>

    <!-- JS 模块 -->
    <script src="js/config.js"></script>
    <script src="js/background.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
